<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>GTA 7 – ikon</title>
<!-- Icon template: open in a browser and screenshot #icon (512×512). ?maskable shrinks the plate into the safe zone, ?favicon draws the small version. -->
<style>
@font-face { font-family: "Big Shoulders Display"; font-weight: 900; src: url(../fonts/big-shoulders-display-latin-900-normal.woff2) format("woff2"); }
html, body { margin: 0; background: #000; }
#icon {
  width: 512px; height: 512px; position: relative; overflow: hidden; display: grid; place-items: center;
  background:
    radial-gradient(70% 55% at 50% 108%, rgba(255, 207, 51, 0.42), rgba(255, 207, 51, 0) 70%),
    radial-gradient(90% 70% at 50% 40%, #1a2130 0%, #0e1117 70%);
}
#icon::after { /* road dashes */
  content: ''; position: absolute; left: 50%; bottom: 26px; width: 14px; height: 70px; margin-left: -7px; border-radius: 4px;
  background: repeating-linear-gradient(180deg, rgba(245, 239, 227, 0.55) 0 26px, transparent 26px 44px);
}
.plate {
  display: inline-flex; align-items: stretch; background: #fbfaf6; color: #121316; border: 9px solid #121316; border-radius: 30px;
  overflow: hidden; box-shadow: inset 0 0 0 6px #fbfaf6, inset 0 0 0 10px #121316, 0 18px 0 rgba(0, 0, 0, 0.35);
  transform-origin: 50% 50%;
}
.eu { background: #1b5eb8; color: #fff; width: 70px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 22px 0 14px; font: 900 56px/1 "Big Shoulders Display", sans-serif; }
.eu i { width: 38px; height: 38px; border-radius: 50%; border: 5px dotted #ffcf33; box-sizing: border-box; }
.txt { font: 900 200px/0.86 "Big Shoulders Display", sans-serif; letter-spacing: 0.03em; padding: 22px 26px 6px; white-space: nowrap; }
.fav .eu { width: 120px; padding: 0; justify-content: center; }
.fav .eu i { display: none; }
.fav .txt { font-size: 330px; padding: 10px 44px 0; }
.fav { border-width: 26px; border-radius: 70px; box-shadow: none; }
</style>
</head>
<body>
<div id="icon"><div class="plate" id="plate"><div class="eu"><i></i>S</div><div class="txt" id="txt">GTA 7</div></div></div>
<script>
  const q = new URLSearchParams(location.search);
  const plate = document.getElementById('plate');
  if (q.has('favicon')) {
    plate.classList.add('fav');
    document.getElementById('txt').textContent = '7';
    document.getElementById('icon').style.background = 'transparent';
    document.styleSheets[0].insertRule('#icon::after { display: none; }');
  }
  document.fonts.ready.then(() => {
    const target = q.has('favicon') ? 500 : q.has('maskable') ? 340 : 452;
    const k = target / plate.offsetWidth;
    plate.style.transform = `rotate(${q.has('favicon') ? 0 : -6}deg) scale(${k})`;
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
